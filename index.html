<!DOCTYPE html>
<html>
    <head>
        <title>Minecraft mod controller</title>
        <meta charset="utf-8">
        <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="container">
            <div class="video">
                <div class="screen" id="screen">
                    <video id="screen_video" autoplay></video>
                </div>
                <div class="webcam" id="webcam">
                    <video id="webcam_video" autoplay></video>
                </div>
            </div>
            <div class="controller">
                <div class="form" id="form0">
                    <select id="user">
                        <option value="" disabled selected>Select a user</option>
                        <option value="broadcast">All users</option>
                    </select>
                </div>
                <div class="form" id="form1">
                    <input type="number" placeholder="X" id="x">
                    <input type="number" placeholder="Y" id="y">
                    <input type="number" placeholder="Z" id="z">
                    <button id="tp">TP</button>
                </div>
                <div class="form" id="form2">
                    <button>KILL</button>
                </div>
                <div class="form" id="form3">
                    <select id="mob">
                        <option value="" disabled selected>Select a mob</option>
                        <optgroup label="Enemies">
                            <option value="zombie">Zombie</option>
                            <option value="skeleton">Skeleton</option>
                            <option value="spider">Spider</option>
                            <option value="creeper">Creeper</option>
                            <option value="witch">Witch</option>
                            <option value="zombie_villager">Zombie villager</option>
                            <option value="giant">Giant zombie</option>
                            <option value="slime">Slime</option>
                            <option value="wither_skeleton">Wither skeleton</option>
                            <option value="wither">Wither</option>
                            <option value="ender_dragon">Dragon</option>
                            <option value="enderman">Enderman</option>
                            <option value="cave_spider">Cave spider</option>
                            <option value="blaze">Blaze</option>
                            <option value="piglin">Piglin</option>
                            <option value="warden">Warden</option>
                            <option value="phantom">Phantom</option>
                            <option value="magma_cube">Magma cube</option>
                            <option value="hoglin">Hoglin</option>
                            <option value="ghast">Ghast</option>
                        </optgroup>
                        <optgroup label="Peaceful">
                            <option value="pig">Pig</option>
                            <option value="cow">Cow</option>
                            <option value="sheep">Sheep</option>
                            <option value="chicken">Chicken</option>
                            <option value="horse">Horse</option>
                            <option value="wolf">Wolf</option>
                            <option value="bee">Bee</option>
                            <option value="donkey">Donkey</option>
                            <option value="rabbit">Rabbit</option>
                            <option value="llama">Llama</option>
                            <option value="bat">Bat</option>
                            <option value="ocelot">Ocelot</option>
                            <option value="villager">Villager</option>
                            <option value="frog">Frog</option>
                            <option value="goat">Goat</option>
                            <option value="sniffer">Sniffer</option>
                            <option value="snow_golem">Snow golem</option>
                            <option value="iron_golem">Iron golem</option>
                        </optgroup>
                        <optgroup label="Weather">
                            <option value="lightning_bolt">Lightning bolt</option>
                        </optgroup>
                    </select>
                    <button>Summon</button>
                </div>
                <div class="form" id="form4">
                    <input type="text" placeholder="Enter your message">
                    <button>Send</button>
                </div>
                <div class="form" id="form5">
                    <input type="text" placeholder="Enter a command">
                    <button>Execute</button>
                </div>
                <div class="form" id="form6">
                    <select id="structure">
                        <option value="" disabled selected>Select a structure</option>
                        <option value="desert_pyramid">Desert pyramid</option>
                        <option value="jungle_pyramid">Jungle pyramid</option>
                        <option value="swamp_hut">Swamp hut</option>
                    </select>
                    <button>Build</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
